<div class="flex flex-col items-center justify-center h-screen">
  <div class="lg:w-100 md:w-80">
    <form
      appearance="floating"
      tuiCardLarge
      tuiForm="m"
      [formGroup]="loginForm"
      (ngSubmit)="login()"
    >
      <header tuiHeader>
        <h2 tuiTitle>Log into TidyBalance</h2>
      </header>

      <tui-textfield>
        <label tuiLabel>Username</label>
        <input formControlName="username" tuiInput />
      </tui-textfield>
      <tui-error formControlName="username" />

      <tui-textfield>
        <label tuiLabel>Password</label>
        <input formControlName="password" tuiInput type="password" />
        <tui-icon tuiPassword />
      </tui-textfield>
      <tui-error formControlName="password" />

      @if (loginForm.hasError(loginFormSubmitErrors.invalidCredentials)) {
        <div tuiError style="color: var(--tui-text-negative)">Incorrect username or password.</div>
      }
      @if (loginForm.hasError(loginFormSubmitErrors.serverUnavailable)) {
        <div tuiError style="color: var(--tui-text-negative)">
          Unable to connect to the server. Please try again later.
        </div>
      }

      <footer>
        <button appearance="primary" tuiButton type="submit" class="w-full!">Log in</button>
      </footer>

      <button
        (click)="createNewAccountBtn()"
        appearance="secondary"
        tuiButton
        type="button"
        class="w-full!"
      >
        Create new account
      </button>
    </form>
  </div>
</div>
