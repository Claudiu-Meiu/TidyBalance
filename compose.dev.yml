services:
  app_db_dev:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT_HOST_DEV}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE_DEV}
      MYSQL_USER: ${MYSQL_USER_DEV}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD_DEV}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD_DEV}
    volumes:
      - mysql_dev_data:/var/lib/mysql

volumes:
  mysql_dev_data:
